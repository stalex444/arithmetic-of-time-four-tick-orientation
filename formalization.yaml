      ORIGIN DECLARATION. The thresholds were first found by computation in
      the author's development record: the tensor substitution's on
      2026-08-29 (findings log F:323); the family's for n = 3..9 on
      2026-10-18 (F:387), for the quartic member on 2026-11-21 (F:559), and
