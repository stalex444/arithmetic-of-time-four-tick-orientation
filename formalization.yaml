fidelity:
  divergences: >-
    (a) "Orientation threshold exactly 4" is stated as its two halves: a
    palindromic factor of length three exists, and every factor of length at
    least four has a non-factor reversal. That no smaller length is oriented
    follows because orientation is inherited by longer lengths; this
    inheritance is the argument of the second half and is not stated as a
    separate theorem. (b) Factors are contiguous sub-blocks (List.IsInfix)
    of the finite iterates S^[k] [seed], not of an infinite fixed point;
    the empty word is a factor. (c) The family's letters are the natural
    numbers 1, ..., n; the Lean rule s n x = if x < n then [x + 1] else
    [1, 2] is a function on all of N (it also sends 0 to 1 and every x > n
    to 1 2, values never reached from the seeds 1, ..., n). Statement 1 is
    for n >= 3 and the seed 1; statement 2 for the seeds 1 <= x <= n. The
    cross-seed form for the family is not stated separately. (d) The tensor
    substitution is one specific ordering of the letters inside the images
    (the product ordering, cubic letter outer); other orderings with the
    same incidence matrix have other thresholds (computed, not formalized).
    (e) Characteristic polynomials and inflation factors appear only in
    docstrings and are not used.

