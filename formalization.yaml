fidelity:
  divergences: >-
    (a) "Orientation threshold exactly 4" is stated as its two halves: a
    palindromic factor of length three exists, and every factor of length at
    least four has a non-factor reversal. That no smaller length is oriented
    follows because orientation is inherited by longer lengths; this
    inheritance is the argument of the second half and is not stated as a
    separate theorem. (b) Factors are contiguous sub-blocks (List.IsInfix)
    of the finite iterates S^[n] [seed], not of an infinite fixed point;
    the empty word is a factor. (c) The cubic statement is for the seed a;
    the quartic and tensor statements also come in an every-seed and
    cross-seed form. (d) The tensor substitution is one specific ordering of
    the letters inside the images (the product ordering, cubic letter
    outer); other orderings with the same incidence matrix have other
    thresholds (computed, not formalized). (e) Characteristic polynomials
    and inflation factors appear only in docstrings and are not used.

