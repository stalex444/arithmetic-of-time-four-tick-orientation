      LITERATURE AND PRIOR-FORMALIZATION SEARCH, 2026-11-26 (arXiv full texts,
      Crossref, the Palomar registry search API, Mathlib master, the Isabelle
      AFP, web search). Finiteness of the threshold is published: Allouche,
      Campbell, Li, Shallit and Stipulanti, Theory Comput. Syst. 69 (2025)
      art. 31 (arXiv:2406.09302), Theorem 11 (a uniformly recurrent sequence
      is reversal-closed or has no long reflected factors); the threshold here
      is one more than the longest reflected factor, and their Proposition 57
      (no paperfolding sequence has a reflected factor of length > 13) is a
      statement of the same kind. The exact values are this entry's. No
      published statement of them was found. Statement 1 was already public,
      uncompared, in the registered repository of PALOMAR-2026-08-19-000006 v2
