    not compared: for the family, the prefix lemma take_S, the parametric
    certificate and its closure under the substitution, completeness at
    length four, the length-four exclusion, the length-three witness and
    the shift lemma; for the tensor, the window lemma, the certificate and
    its kernel checks, completeness, the length-four exclusion and the
    seed-occurrence lemmas. Not formalized: the exact factor counts of the
    family (n^2 - n + 1, 2n^2 - 3n + 2, 3n^2 - 4n at lengths 2, 3, 4) and
    the exactness of its index-rule certificate (computed for n = 3..40);
    the tensor factor counts and the occurrence of every tensor
    certificate word; the characteristic polynomials and inflation
    factors; the cross-seed form of statement 1 as a separate statement
    (it follows from statements 1 and 2); and the computed dependence of
    the tensor threshold on the order of letters inside the images
    (README, 'What is not claimed').
