# A new entry, a companion of the registered entries PALOMAR-2026-08-19-000006,
# PALOMAR-2026-09-04-000004 and PALOMAR-2026-10-18-000019; not a revision of any of them.
# DRAFT, prepared locally 2026-11-26 (version 2 of the package: the family theorem leads).
# The one item marked for the author below (review notes) must be cleared before submission
# (a pre-submission check looks for its sentinel).
version: "v0.4"

project:
  name: "The orientation threshold 4 for the substitutions of x^n - x - 1, n >= 3, and the twelve-letter rho Q tensor"
  description: >-
    Kernel-checked proofs, in Lean 4 + Mathlib, of five statements about the
    factor languages of substitutions. Call a length L oriented when no
    factor of length L has its reversal among the factors; being oriented
    passes to every longer length, and fails at L when some factor of length
    L is a palindrome. The orientation threshold is the least oriented
    length (one more than the greatest length of a reflected factor).
    (1) For every n >= 3, the substitution sigma_n on the letters 1, ..., n,
    i -> i+1 (i < n), n -> 1 2, whose incidence matrix has characteristic
    polynomial x^n - x - 1, has orientation threshold exactly 4 from the
    seed 1: some factor of length three is its own reversal (1 2 1), and
    every factor of length at least four has a reversal that is not a
    factor. One proof covers every n: the certificate is a set of index
    rules checked by omega, not an enumeration. n = 3 is the cubic Padovan
    substitution a -> b, b -> c, c -> ab and n = 4 the quartic substitution
    a -> b, b -> c, c -> d, d -> ab. (2) For every letter 1 <= x <= n, the
    factor language of sigma_n from x is the one from 1. (3) The same as
    (1) for the twelve-letter tensor product of the cubic and the quartic
    substitution on {p, q, r} x {1, 2, 3, 4}, seed p1 (q1 q2 q1); its
    incidence matrix is the Kronecker product, with characteristic
    polynomial the minimal polynomial of rho Q (the product of the two real
    roots greater than one). The tensor is not a member of the family.
    (4) The tensor factor language is the same from every seed letter.
    (5) Statement 3 from every seed and across seeds. No native_decide is
    used: the family proof is omega and simp, the tensor proof a finite
    certificate checked by decide / decide +kernel. No physical
    identification is an axiom, a hypothesis or a conclusion of any
    statement.
  authors:
    - "Stephanie Alexander"
  license: "MIT"
  responsible_maintainers:
    - "Stephanie Alexander"

