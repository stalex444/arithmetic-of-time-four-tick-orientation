      index-rule certificate was also checked against the exact factor sets
      for n = 3..40. Kernel proofs: the cubic member 2026-09-04 (F:370), the
      tensor 2026-11-25 (F:653), the quartic member 2026-11-26 (F:654), and
      the family theorem for every n >= 3 on 2026-11-26, which this entry
      compares.
      LITERATURE AND PRIOR-FORMALIZATION SEARCH, done 2026-11-26 (arXiv full
      texts, Crossref, the Palomar registry search API, Mathlib master, the
      Isabelle AFP, web search). Finiteness of the threshold is published:
      Allouche, Campbell, Li, Shallit and Stipulanti, Theory Comput. Syst. 69
      (2025) art. 31 (arXiv:2406.09302), Theorem 11 (a uniformly recurrent
      sequence is reversal-closed or has no long reflected factors); the
      threshold here is one more than the longest reflected factor, and their
      Proposition 57 (no paperfolding sequence has a reflected factor of
      length > 13) is a statement of the same kind. This entry proves the exact value 4 for every n >= 3 (the case n = 3 already public in the author's 000006 repository, below) and for the tensor. No published statement of it was found; the search covered the cubic, the quartic and the tensor substitution by name and rule, and the family as a standalone question (second search, 2026-11-26: no statement of the value, the longest reflected factor or the non-closure under reversal for any member with n >= 4; nearest: ACLSS Proposition 57; the Narayana-type sister family's non-closure via Frougny-Masakova-Pelantova 2004; the value 3 is not specific to this family). The case n = 3 of
      statement 1 (seed a, letters a, b, c) was already public, uncompared,
      in the registered repository of PALOMAR-2026-08-19-000006 v2 at
      dff2591 (PDT.Padovan.exact_orientation_threshold_four in PdtFourTickThreshold.lean; the
      every-seed form padovan_exact_orientation_threshold_four in
      Supplement.lean); it is the author's own earlier proof. No public
      repository containing the other cases or statements was found. This
      is a search result, not a guarantee.
