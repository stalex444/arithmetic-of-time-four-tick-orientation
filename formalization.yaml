# A new entry, a companion of the registered entries PALOMAR-2026-08-19-000006,
# PALOMAR-2026-09-04-000004 and PALOMAR-2026-10-18-000019; not a revision of any of them.
# DRAFT, prepared locally 2026-11-26. The TODO-PI items below must be cleared by the author
# before submission (a pre-submission check looks for that sentinel).
version: "v0.4"

project:
  name: "The exact orientation threshold 4 of the cubic Padovan substitution, the quartic substitution and their twelve-letter tensor (inflation factor rho Q)"
  description: >-
    Kernel-checked proofs, in Lean 4 + Mathlib, of seven statements about the
    factor languages of three substitutions: the cubic Padovan substitution
    a -> b, b -> c, c -> ab (characteristic polynomial x^3 - x - 1), the
    quartic substitution a -> b, b -> c, c -> d, d -> ab (x^4 - x - 1), and
    their twelve-letter tensor product on {p, q, r} x {1, 2, 3, 4}, whose
    incidence matrix is the Kronecker product, with characteristic
    polynomial the minimal polynomial of rho Q (the product of the two real
    roots greater than one). Call a length L oriented when no factor of
    length L has its reversal among the factors; being oriented passes to
    every longer length, and fails at L when some factor of length L is a
    palindrome. (1) For the cubic substitution from the seed a: some factor
    of length three is its own reversal (a b a), and every factor of length
    at least four has a reversal that is not a factor. So the orientation
    threshold is exactly 4. (2) The same for the quartic substitution (a b a).
    (3) The quartic factor language is the same from every seed letter.
    (4) Statement 2 from every seed x, with the reversal excluded from the
    language of every seed y. (5) The same as (1) for the tensor
    substitution from the seed p1 (q1 q2 q1). (6) The tensor factor language
    is the same from every seed letter. (7) Statement 5 from every seed and
    across seeds. The proof is a finite certificate of short words, closed
    under short windows of images and checked by decide / decide +kernel
    (no native_decide), propagated to all iterates by a window lemma and to
    all lengths at least four by factor closure. No physical identification
    is an axiom, a hypothesis or a conclusion of any statement.
  authors:
    - "Stephanie Alexander"
  license: "MIT"
  responsible_maintainers:
    - "Stephanie Alexander"

